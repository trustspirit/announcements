<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지</title>
<meta name="description" content="예수 그리스도 후기 성도 교회 회원을 위한 안내 페이지 모음입니다.">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F2F3EF">
<meta property="og:type" content="website">
<meta property="og:title" content="공지">
<meta property="og:description" content="예수 그리스도 후기 성도 교회 회원을 위한 안내 페이지 모음입니다.">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://trustspirit.github.io/announcements/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">

<style>
:root {
  color-scheme: light;
  --paper:      #F2F3EF;
  --card:       #FBFBF9;
  --ink:        #161C19;
  --ink-2:      #566058;
  --ink-3:      #7C857E;
  --rule:       #D9DCD4;
  --rule-faint: #E4E7E0;
  --jade:       #1C6455;
  --jade-2:     #2E8A76;
  --shadow:     0 1px 2px rgba(22,28,25,.05), 0 8px 28px -18px rgba(22,28,25,.35);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.78;
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--jade-2); outline-offset: 3px; border-radius: 2px; }

.wrap {
  max-width: 760px; margin-inline: auto;
  padding: clamp(56px, 12vw, 112px) clamp(20px, 5vw, 48px) clamp(48px, 8vw, 88px);
}
.eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .16em; color: var(--jade); margin: 0 0 18px;
}
h1 {
  font-family: var(--f-display); font-weight: 700;
  font-size: clamp(38px, 9vw, 60px); line-height: 1.1; letter-spacing: -.025em;
  margin: 0 0 18px;
}
.lede { color: var(--ink-2); max-width: 40ch; margin: 0 0 clamp(40px, 7vw, 64px); }

h2 {
  font-size: 13px; font-weight: 600; letter-spacing: .13em; color: var(--ink-3);
  margin: 0 0 20px; padding-bottom: 10px; border-bottom: 1px solid var(--rule);
}

.list { display: grid; gap: 18px; }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 0;
  background: var(--card); border: 1px solid var(--rule); border-radius: 4px;
  overflow: hidden; text-decoration: none; color: inherit;
  box-shadow: var(--shadow); transition: border-color .18s, transform .12s;
}
@media (min-width: 620px) { .item { grid-template-columns: 220px minmax(0, 1fr); } }
.item:hover { border-color: var(--jade); }
.item:active { transform: translateY(1px); }
.item-img { background: var(--rule-faint); }
.item-img img { width: 100%; height: 100%; min-height: 132px; object-fit: cover; object-position: 50% 62%; }
.item-body { padding: 22px 24px 24px; }
.item-date {
  font-size: 12.5px; font-weight: 500; letter-spacing: .06em; color: var(--ink-3);
  margin: 0 0 8px; font-variant-numeric: tabular-nums;
}
.item h3 {
  font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.3;
  letter-spacing: -.02em; margin: 0 0 8px;
}
.item p { margin: 0; font-size: 15.5px; color: var(--ink-2); line-height: 1.7; }
.item .go {
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 14px; font-size: 14.5px; font-weight: 500; color: var(--jade);
}
.item:hover .go { color: var(--jade-2); }

footer {
  border-top: 1px solid var(--rule); margin-top: clamp(48px, 8vw, 80px); padding-top: 26px;
  font-size: 13.5px; line-height: 1.75; color: var(--ink-3); max-width: 54ch;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">예수 그리스도 후기 성도 교회</p>
  <h1>공지</h1>
  <p class="lede">회원들이 보고 그대로 따라 할 수 있도록 만든 안내 페이지 모음입니다.</p>

  <h2>안내</h2>
  <div class="list">
    <a class="item" href="temple-week/">
      <div class="item-img"><img src="temple-week/og.jpg" alt="맑은 하늘 아래 서 있는 서울 성전." loading="lazy"></div>
      <div class="item-body">
        <p class="item-date">2026년 8월 24일(월) ~ 29일(토)</p>
        <h3>성전으로 가는 한 주</h3>
        <p>패밀리트리 앱에 조상을 올리고 제적등본을 떼어, 토요일 성전에 가져갈 QR 코드까지 준비하는 하루하루 안내입니다.</p>
        <span class="go">열기
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </span>
      </div>
    </a>
  </div>

  <footer>
    각 안내는 여는 날짜에 맞춰 그날 할 일로 자동 이동합니다. 체크 표시는 보는 기기에만 저장되며 어디로도 전송되지 않습니다.
  </footer>
</div>

</body>
</html>
